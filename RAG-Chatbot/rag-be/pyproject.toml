[project]
name = "rag-be"
version = "1.0.0"
description = "Generic, configurable RAG backend (Ollama / Gemini / DeepSeek / OpenRouter; Chroma / Postgres / Neon)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "chromadb>=0.5",
    "psycopg[binary,pool]>=3.1",
]

[project.optional-dependencies]
# Heavy (pulls in torch). Skip if you use the gemini / ollama embedding providers.
local = ["sentence-transformers>=3.0"]
# Only for the standalone scripts in learning/
learning = ["asyncpg>=0.29", "openai>=1.30"]
dev = ["pytest>=8", "pytest-asyncio", "pgserver"]

[tool.setuptools]
packages = ["app", "app.core", "app.llm", "app.llm.openai", "app.llm.groq", "app.llm.gemini", "app.llm.ollama", "app.llm.deepseek", "app.llm.openrouter", "app.embeddings", "app.vectorstores", "app.ingestion", "app.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
