# Local Postgres with pgvector, for the "advanced" preset.
#   docker compose up -d
#   DATABASE_URL=postgresql://rag:rag@localhost:5432/rag
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
